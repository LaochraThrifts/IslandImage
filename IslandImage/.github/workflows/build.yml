name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project IslandImage.xcodeproj \
            -scheme IslandImage \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IslandImage.app Payload/
          zip -qr IslandImage.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: IslandImage-ipa
          path: IslandImage.ipa
